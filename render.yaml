databases:
  - name: sensybull-db
    # Must match (or exceed) the live instance's plan — Render rejects a
    # blueprint sync that would downgrade a database. The free tier expires
    # after 30 days. Upgraded from basic-256mb with the fundamentals explorer
    # (Sept 2026): ~6k companies × ~85 reporting periods with the raw FMP
    # payloads retained is ~1.5 GB, and the page queries want the working set
    # in RAM. diskSizeGB leaves headroom for the rolling refresh churn.
    plan: basic-1gb
    diskSizeGB: 10
    databaseName: sensybull
    user: sensybull
    ipAllowList: []  # only internal access

services:
  # ── API service ───────────────────────────────────────────────────────
  - type: web
    name: sensybull-api
    runtime: docker
    plan: starter
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /health
    # Two homes for this service's env vars, no key in both:
    # - here: wiring to other blueprint resources and non-secret tuning,
    #   so it is version-controlled and a sync can't drift from it;
    # - the "sensybull-api" env group (Render dashboard): secrets and
    #   per-deployment app config — SECRET_KEY, JWT_SECRET_KEY, FMP_API_KEY,
    #   SENTRY_DSN, RESEND_API_KEY, GOOGLE_*, APPLE_CLIENT_ID, VAPID_*,
    #   TELEGRAM_*, SEC_USER_AGENT, CORS_ALLOWED_ORIGINS, FRONTEND_URL,
    #   SHARE_BASE_URL, MAIL_*, SUPPORT_EMAIL.
    # A key set on the service overrides the group, so a duplicate here
    # silently shadows the group's value.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensybull-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sensybull-redis
          type: redis
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          name: sensybull-redis
          type: redis
          property: connectionString
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      # FMP (fundamentals + market data); the key itself is in the group.
      - key: FMP_CALLS_PER_MINUTE
        value: "600"   # per client: prices and the on-demand backfill each get 600; plus the cron's 1,500 stays under Ultimate's 3,000
      - key: FUNDAMENTALS_ON_DEMAND
        value: "true"  # first visit to an unsynced ticker backfills it in-process

  # ── Ingest service ────────────────────────────────────────────────────
  - type: worker
    name: sensybull-ingest
    runtime: docker
    plan: starter
    dockerfilePath: ./services/ingest/Dockerfile
    dockerContext: ./services/ingest
    envVars:
      - key: REDIS_URL
        fromService:
          name: sensybull-redis
          type: redis
          property: connectionString
      - key: GROQ_API_KEYS
        sync: false  # comma-separated Groq keys
      - key: SEC_USER_AGENT
        sync: false
      # ── Press-release ingestion (see services/ingest/press_release/) ──
      - key: PR_INGEST_ENABLED
        value: "0"   # flip to 1 after tools/probe_fmp_press_releases.py --gates looks right
      - key: PR_SOURCE
        value: fmp   # FMP's aggregated press-release endpoint; "rss" = the old per-wire feeds
      - key: FMP_API_KEY
        sync: false  # same key as the API's group; ingest isn't in that group
      - key: PR_FMP_POLL_SECONDS
        value: "1"   # 60 calls/min — fits beside the API's 1,200 and the cron's 1,500 under 3,000
      - key: PR_WORKERS
        value: "4"   # concurrent article-fetch + LLM passes
      - key: PR_DRY_RUN
        value: "1"   # run every gate, log "would publish", publish nothing — set 0 to go live
      - key: PR_POLL_INTERVAL
        value: "180" # RSS source only
      - key: PR_USER_AGENT
        sync: false  # e.g. "Mozilla/5.0 (compatible; SensybullFeedReader/1.0)"

  # ── Company sync cron job ──────────────────────────────────────────────
  - type: cron
    name: sensybull-company-sync
    runtime: docker
    plan: starter
    schedule: "0 6 * * *"  # daily at 06:00 UTC
    dockerfilePath: ./services/api/Dockerfile.cron
    dockerContext: ./services/api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensybull-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Every step is FMP now (company list, shares, prices, fundamentals);
      # the cron no longer calls the SEC, so it carries no SEC_USER_AGENT.
      - key: FMP_API_KEY
        sync: false
      - key: FMP_CALLS_PER_MINUTE
        value: "1500"
      - key: FUNDAMENTALS_SYNC_LIMIT
        value: "6000"  # whole universe per run; the first run is the backfill

  # ── Redis ─────────────────────────────────────────────────────────────
  - type: redis
    name: sensybull-redis
    plan: free
    ipAllowList: []  # only internal access
    maxmemoryPolicy: allkeys-lru
