databases:
  - name: sensybull-db
    # Must match (or exceed) the live instance's plan — Render rejects a
    # blueprint sync that would downgrade a database. The free tier expires
    # after 30 days. Upgraded from basic-256mb with the fundamentals explorer
    # (Sept 2026): ~6k companies × ~85 reporting periods with the raw FMP
    # payloads retained is ~1.5 GB, and the page queries want the working set
    # in RAM. diskSizeGB leaves headroom for the rolling refresh churn.
    plan: basic-1gb
    diskSizeGB: 10
    databaseName: sensybull
    user: sensybull
    ipAllowList: []  # only internal access

services:
  # ── API service ───────────────────────────────────────────────────────
  - type: web
    name: sensybull-api
    runtime: docker
    plan: starter
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensybull-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sensybull-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false  # set manually after frontend is deployed
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: RATELIMIT_STORAGE_URI
        fromService:
          name: sensybull-redis
          type: redis
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      # ── Financial Modeling Prep: fundamentals + market data (quotes, bars,
      #    price reactions). Also starts the price-reaction worker. ──
      - key: FMP_API_KEY
        sync: false
      - key: FMP_CALLS_PER_MINUTE
        value: "600"   # per client: prices and the on-demand backfill each get 600; plus the cron's 1,500 stays under Ultimate's 3,000
      - key: FUNDAMENTALS_ON_DEMAND
        value: "true"  # first visit to an unsynced ticker backfills it in-process

  # ── Ingest service ────────────────────────────────────────────────────
  - type: worker
    name: sensybull-ingest
    runtime: docker
    plan: starter
    dockerfilePath: ./services/ingest/Dockerfile
    dockerContext: ./services/ingest
    envVars:
      - key: REDIS_URL
        fromService:
          name: sensybull-redis
          type: redis
          property: connectionString
      - key: GROQ_API_KEYS
        sync: false  # comma-separated Groq keys
      - key: SEC_USER_AGENT
        sync: false
      # ── Press-release ingestion (see services/ingest/press_release/) ──
      - key: PR_INGEST_ENABLED
        value: "0"   # flip to 1 after validating feeds with tools/probe_pr_feeds.py
      - key: PR_POLL_INTERVAL
        value: "180"
      - key: PR_USER_AGENT
        sync: false  # e.g. "Mozilla/5.0 (compatible; SensybullFeedReader/1.0)"

  # ── Company sync cron job ──────────────────────────────────────────────
  - type: cron
    name: sensybull-company-sync
    runtime: docker
    plan: starter
    schedule: "0 6 * * *"  # daily at 06:00 UTC
    dockerfilePath: ./services/api/Dockerfile.cron
    dockerContext: ./services/api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensybull-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SEC_USER_AGENT
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: FMP_CALLS_PER_MINUTE
        value: "1500"
      - key: FUNDAMENTALS_SYNC_LIMIT
        value: "6000"  # whole universe per run; the first run is the backfill

  # ── Redis ─────────────────────────────────────────────────────────────
  - type: redis
    name: sensybull-redis
    plan: free
    ipAllowList: []  # only internal access
    maxmemoryPolicy: allkeys-lru
